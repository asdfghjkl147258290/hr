<!doctype html>
<html>
<head>
  <meta charset='utf-8' />
  <title>HR 管理端</title>
  <style>body{font-family:sans-serif;margin:20px} img{width:120px;height:80px;object-fit:cover;margin:6px;border:1px solid #ccc}</style>
</head>
<body>
  <h2>HR 管理端</h2>
  <div>
    <label>管理员密码: <input id="password" type="password" /></label>
  </div>
  <hr />
  <div>
    <h3>上传照片</h3>
    <input id="file" type="file" multiple accept="image/*" />
    <button id="uploadBtn">上传</button>
  </div>
  <div>
    <h3>配置（照片上限）</h3>
    <input id="maxPhotos" type="number" min="0" />
    <button id="saveConfig">保存</button>
  </div>
  <hr />
  <h3>当前照片</h3>
  <div id="photos"></div>

<script>
const passwordInput = document.getElementById('password');
const fileInput = document.getElementById('file');
const uploadBtn = document.getElementById('uploadBtn');
const photosDiv = document.getElementById('photos');
const maxInput = document.getElementById('maxPhotos');
const saveConfigBtn = document.getElementById('saveConfig');

async function fetchState() {
  const r = await fetch('/api/photos');
  const j = await r.json();
  renderPhotos(j.photos);
  maxInput.value = j.config.maxPhotos || 0;
}
function renderPhotos(photos){
  photosDiv.innerHTML = '';
  photos.forEach(p=>{
    const d = document.createElement('div');
    d.style.display='inline-block';
    const img = document.createElement('img');
    img.src = p.url;
    const btn = document.createElement('button');
    btn.textContent='删除';
    btn.onclick = async ()=> {
      await fetch('/api/delete', {
        method:'POST',
        headers: {'Content-Type':'application/json','x-admin-password': passwordInput.value},
        body: JSON.stringify({ filename: p.filename })
      });
      fetchState();
    };
    d.appendChild(img);
    d.appendChild(document.createElement('br'));
    d.appendChild(btn);
    photosDiv.appendChild(d);
  });
}

uploadBtn.onclick = async () => {
  if (!passwordInput.value) return alert('请输入管理员密码');
  const files = fileInput.files;
  if (!files.length) return alert('请选择文件');
  const form = new FormData();
  for (const f of files) form.append('photos', f);
  const r = await fetch('/api/upload', {
    method:'POST',
    headers: {'x-admin-password': passwordInput.value},
    body: form
  });
  const j = await r.json();
  if (j.ok) {
    fetchState();
    fileInput.value = '';
  } else {
    alert('上传失败');
  }
};

saveConfigBtn.onclick = async () => {
  if (!passwordInput.value) return alert('请输入管理员密码');
  const maxPhotos = parseInt(maxInput.value) || 0;
  await fetch('/api/config', {
    method:'POST',
    headers: {'Content-Type':'application/json','x-admin-password': passwordInput.value},
    body: JSON.stringify({ maxPhotos })
  });
  fetchState();
};

fetchState();

// 实时更新（可选）
const socket = io();
socket.on('photos-updated', data => {
  renderPhotos(data.photos || []);
  maxInput.value = (data.config && data.config.maxPhotos) || 0;
});
</script>
<script src="/socket.io/socket.io.js"></script>
</body>
</html>
